; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW fonts (Noto Sans SemiBold), one per UI pixel size.
; Rebuild with: python3 scripts/build_ui_fonts.py
board_build.embed_files =
  data/ui_font_15.vlw
  data/ui_font_13.vlw
  data/ui_font_11.vlw
  data/ui_font_9.vlw

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Stage 2 of the quality pipeline: the portal input parsers build and run on the
; host, so malformed and hostile field values are exercised without a board.
;   pio test -e native
[env:native]
platform = native
test_framework = unity
; pio test links only the test files unless this is set; without it the tests
; compile but cannot find util::coords::parseCoordinate at link time.
test_build_src = yes
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I include
; Only util/ is host-portable; the rest of src/ needs the Arduino core.
build_src_filter = -<*> +<util/>
