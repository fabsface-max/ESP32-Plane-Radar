# Build firmware on push/PR; upload binaries as a short-lived artifact.
name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            .pio/libdeps
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: |
          set -o pipefail
          pio run -e supermini 2>&1 | tee build.log

      - name: Fail on warnings in project code
        # Stage 1 of the quality pipeline. Third-party libraries warn plenty and
        # are not ours to fix, so exclude anything compiled out of .pio/ (library
        # dependencies) or ~/.platformio/ (toolchain and framework). Matching
        # project paths positively is not enough: LovyanGFX has its own src/.
        run: |
          if grep -E ': (warning|error):' build.log |
             grep -vE '(^|/)\.pio/|/\.platformio/'; then
            echo "::error::compiler warnings in project code"
            exit 1
          fi
          echo "No compiler warnings in project code."

      - name: Merge web-flash image
        run: pio run -t merge -e supermini

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plane-radar-supermini
          if-no-files-found: error
          path: |
            .pio/build/supermini/firmware-merged.bin
            .pio/build/supermini/firmware.bin
            .pio/build/supermini/bootloader.bin
            .pio/build/supermini/partitions.bin
